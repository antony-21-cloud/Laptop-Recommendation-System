<!DOCTYPE html>
<html lang="en">
<head>
    <script src="https://cdn.tailwindcss.com"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LaptopRec Pro</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>/* Stats Grid */
.stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 30px; }
.stat-card { background: #1c1c1c; border: 1px solid #333; padding: 20px; border-radius: 12px; transition: 0.3s; }
.stat-card:hover { transform: translateY(-5px); box-shadow: 0 10px 20px rgba(0,0,0,0.3); }
.stat-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
.stat-icon { width: 45px; height: 45px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; }
.trend { font-size: 0.85rem; font-weight: 500; color: #10b981; }

/* Profile Layout */
.profile-container { display: grid; grid-template-columns: 1fr 2fr; gap: 25px; }
.profile-side { display: flex; flex-direction: column; gap: 20px; }
.glass-card { background: #1c1c1c; border: 1px solid #333; border-radius: 12px; padding: 25px; }
.status-card { background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%); color: white; padding: 25px; border-radius: 12px; }

/* Form Elements */
.profile-form { display: flex; flex-direction: column; gap: 20px; }
.form-group { display: flex; flex-direction: column; gap: 8px; }
.form-group label { color: #888; font-size: 0.9rem; display: flex; align-items: center; gap: 8px; }
.form-group input, .form-group textarea { 
    background: #0f0f0f; border: 1px solid #333; color: white; padding: 12px; border-radius: 8px; outline: none; transition: 0.3s; 
}
.form-group input:focus { border-color: #3b82f6; box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2); }
.form-group input:disabled { background: #161616; cursor: not-allowed; color: #666; }

/* Profile Avatar */
.avatar-circle { 
    width: 120px; height: 120px; border-radius: 50%; margin: 0 auto 15px;
    background: linear-gradient(to bottom right, #3b82f6, #8b5cf6);
    display: flex; align-items: center; justify-content: center; font-size: 2.5rem; font-weight: bold; color: white;
}
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0f0f0f; color: #e0e0e0; display: flex; min-height: 100vh; }
        
        .sidebar { 
            width: 260px; 
            background: #161616; 
            border-right: 1px solid #333; 
            position: fixed; 
            height: 100vh; 
            padding: 30px 20px; 
            display: flex; 
            flex-direction: column; 
        }

        .sidebar h2 { color: white; margin-bottom: 40px; font-size: 1.5rem; }

        .nav-links { display: flex; flex-direction: column; gap: 10px; flex-grow: 1; }
        
        .nav-links a { 
            color: #888; 
            text-decoration: none; 
            padding: 12px 15px; 
            border-radius: 8px; 
            transition: 0.3s; 
            display: flex; 
            align-items: center; 
            gap: 12px;
        }

        .nav-links a:hover, .nav-links a.active { background: #252525; color: white; }
        
        .logout-link { color: #ff4d4d !important; margin-top: auto; border-top: 1px solid #333; padding-top: 20px; }
        
        .main-content { margin-left: 260px; flex: 1; padding: 40px; width: calc(100% - 260px); }
    </style>
</head>
<body>
    <div class="sidebar">
        <h2>LaptopRec</h2>
        
        <nav class="nav-links">
    <a href="{{ url_for('index') }}">
        <i class="fas fa-home"></i> HOME
    </a>

    {% if current_user.is_authenticated %}
        {% if current_user.role == 'seller' %}
            <a href="/seller_dashboard" id="nav-profile">
                <i class="fas fa-user"></i> PROFILE
            </a>
            <a href="/seller_dashboard" id="nav-uploads">
                <i class="fas fa-laptop"></i> UPLOADS
            </a>
        {% endif %}

        <a href="{{ url_for('logout') }}" class="logout-link">
            <i class="fas fa-sign-out-alt"></i> LOGOUT
        </a>
    {% else %}
        <a href="{{ url_for('login') }}">LOGIN</a>
    {% endif %}
</nav>
    </div>

    <div class="main-content">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
