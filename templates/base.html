<!DOCTYPE html>
<html lang="en">
<head>
    <script src="https://cdn.tailwindcss.com"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LaptopRec Pro</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', 'Inter', sans-serif; }
        
        body { 
            background: #0a0a0a;
            color: #ffffff;
            display: flex;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Sidebar */
        .sidebar-fixed { 
            width: 288px; 
            background: #000000;
            border-right: 1px solid #1a1a1a;
            position: fixed; 
            height: 100vh; 
            display: flex; 
            flex-direction: column; 
            z-index: 50;
        }

        /* Sidebar Links */
        .sidebar-link {
            display: flex;
            align-items: center;
            padding: 12px 20px;
            margin: 4px 12px;
            color: #a0a0a0;
            text-decoration: none;
            transition: all 0.3s ease;
            border-radius: 10px;
            font-weight: 500;
            font-size: 0.85rem;
            gap: 12px;
        }

        .sidebar-link:hover {
            background: #1a1a1a;
            color: #ffffff;
        }

        .active-tab {
            background: #1a3a5c;
            color: #ffffff !important;
        }

        .main-content { 
            margin-left: 288px; 
            flex: 1; 
            width: calc(100% - 288px);
            min-height: 100vh;
            background: #0a0a0a;
        }
        
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #1a1a1a;
        }
        ::-webkit-scrollbar-thumb {
            background: #2c5282;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #3b6cb0;
        }
        
        /* Card styles */
        .card {
            background: #111111;
            border: 1px solid #222222;
            border-radius: 12px;
        }
        
        .card-hover:hover {
            border-color: #2c5282;
            transition: all 0.3s ease;
        }
        
        /* Button styles */
        .btn-primary {
            background: #ffffff;
            color: #000000;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        
        .btn-primary:hover {
            background: #2c5282;
            color: #ffffff;
            transform: translateY(-2px);
        }
        
        .btn-secondary {
            background: #222222;
            color: #ffffff;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        
        .btn-secondary:hover {
            background: #2c5282;
            transform: translateY(-2px);
        }
        
        /* Input styles */
        input, select, textarea {
            background: #0a0a0a;
            border: 1px solid #333333;
            color: #ffffff;
            transition: all 0.3s ease;
        }
        
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #2c5282;
            box-shadow: 0 0 0 2px rgba(44, 82, 130, 0.3);
        }
        
        /* Table styles */
        table {
            width: 100%;
        }
        
        th {
            background: #0a0a0a;
            color: #a0a0a0;
            font-weight: 600;
            padding: 12px;
        }
        
        td {
            padding: 12px;
            border-top: 1px solid #222222;
        }
        
        tr:hover {
            background: #111111;
        }

        /* Modal animation */
#laptop-details-modal {
    transition: all 0.3s ease;
}

#laptop-details-modal .bg-black {
    transform: scale(0.95);
    transition: transform 0.3s ease;
}

#laptop-details-modal.flex .bg-black {
    transform: scale(1);
}

        /* Hero section */
        .hero{
            background: url('/static/images/hero-bg.jpg') no-repeat center center/cover;
            height: 80vh;
            display: flex;
            flex-direction: column;}
    </style>
</head>
<body>

    <aside class="sidebar-fixed p-6">
        <div class="mb-10">
            <h2 class="text-2xl font-bold text-white">LAPTOP<span class="text-blue-500">IQ</span></h2>
            <p class="text-[10px] text-gray-500 font-mono tracking-widest uppercase mt-2">System Control</p>
        </div>

        <nav class="flex flex-col gap-1 flex-1">
            <a href="#" onclick="window.dashboardShowTab('home')" class="sidebar-link active-tab" id="home-link">
                <i class="fas fa-home w-5"></i> HOME
            </a>
            
            {% if current_user.role == 'student' %}
            <a href="#" onclick="window.dashboardShowTab('search')" class="sidebar-link" id="search-link">
                <i class="fas fa-search w-5"></i> SEARCH
            </a>
            <a href="#" onclick="window.dashboardShowTab('requests')" class="sidebar-link" id="requests-link">
                <i class="fas fa-envelope w-5"></i> REQUESTS
            </a>
            {% elif current_user.role == 'seller' %}
            <a href="#" onclick="window.dashboardShowTab('uploads')" class="sidebar-link" id="uploads-link">
                <i class="fas fa-cloud-upload-alt w-5"></i> UPLOADS
            </a>
            <a href="#" onclick="window.dashboardShowTab('inquiries')" class="sidebar-link" id="inquiries-link">
                <i class="fas fa-envelope w-5"></i> INQUIRIES
            </a>
            {% endif %}
            
            <a href="#" onclick="window.dashboardShowTab('support')" class="sidebar-link" id="support-link">
                <i class="fas fa-tools w-5"></i> SUPPORT
            </a>
        </nav>

        <div class="pt-6 mt-auto border-t border-gray-800">
            <a href="{{ url_for('logout') }}" class="flex items-center gap-3 px-4 py-3 text-red-400 hover:text-red-300 transition-all text-xs font-bold uppercase tracking-widest rounded-lg hover:bg-red-900/20">
                <i class="fas fa-sign-out-alt"></i> LOGOUT
            </a>
        </div>
    </aside>



    <div class="main-content">
        {% block content %}{% endblock %}
    </div>

    <script>
    window.dashboardShowTab = function(tabName) {
        console.log("Switching to tab:", tabName);
        document.querySelectorAll('.tab-content').forEach(function(tab) {
            tab.classList.add('hidden');
        });
        var activeTab = document.getElementById('tab-' + tabName);
        if (activeTab) {
            activeTab.classList.remove('hidden');
        }
        document.querySelectorAll('.sidebar-link').forEach(function(link) {
            link.classList.remove('active-tab');
        });
        var activeLink = document.getElementById(tabName + '-link');
        if (activeLink) {
            activeLink.classList.add('active-tab');
        }
        if (typeof window.loadInquiries === 'function' && tabName === 'inquiries') {
            window.loadInquiries();
        }
        if (typeof window.loadRequests === 'function' && tabName === 'requests') {
            window.loadRequests();
        }
    };
</script>
</body>
</html>
