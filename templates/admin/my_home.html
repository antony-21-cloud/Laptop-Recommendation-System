{% extends 'base.html' %}

{% block content %}
<div class="min-h-screen bg-slate-950 text-slate-100 p-6 font-mono">
    <div class="border-b-2 border-rose-900 pb-4 mb-8 flex justify-between items-end">
        <div>
            <h1 class="text-3xl font-black text-rose-600 tracking-widest">SYSTEM_OVERRIDE://ARISTO_ROOT</h1>
            <p class="text-[10px] text-rose-400 opacity-70 italic">Authorized Access Only - Full Database Privileges</p>
        </div>
        <div class="text-right">
            <p class="text-xs text-slate-500">SERVER_STATUS: <span class="text-emerald-500 animate-pulse">ONLINE</span></p>
        </div>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-8">
        <div class="bg-slate-900 border-l-4 border-rose-600 p-4">
            <p class="text-slate-500 text-[10px]">TOTAL_USERS</p>
            <h2 id="admin-user-count" class="text-2xl font-bold">0</h2>
        </div>
        <div class="bg-slate-900 border-l-4 border-cyan-600 p-4">
            <p class="text-slate-500 text-[10px]">GLOBAL_INVENTORY</p>
            <h2 id="admin-laptop-count" class="text-2xl font-bold">0</h2>
        </div>
    </div>

    <div class="bg-slate-900 border border-slate-800 rounded shadow-2xl">
        <div class="p-4 border-b border-slate-800 bg-slate-800/50">
            <h3 class="text-xs font-bold text-rose-400">USER_REGISTRY_DATABASE</h3>
        </div>
        <table class="w-full text-left text-xs">
            <thead class="text-slate-500 uppercase">
                <tr>
                    <th class="p-4">UID</th>
                    <th class="p-4">USERNAME</th>
                    <th class="p-4">ACCESS_LEVEL</th>
                    <th class="p-4 text-right">SYSTEM_ACTIONS</th>
                </tr>
            </thead>
            <tbody id="admin-user-table" class="divide-y divide-slate-800">
                </tbody>
        </table>
    </div>
</div>
{% endblock %}
