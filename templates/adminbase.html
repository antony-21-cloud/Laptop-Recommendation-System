<!DOCTYPE html>
<html lang="en">
<head>
    <script src="https://cdn.tailwindcss.com"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LaptopIQ - Admin Panel</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: #0a0a0a;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        /* Admin Sidebar */
        .admin-sidebar {
            width: 280px;
            background: #000000;
            border-right: 1px solid #1a1a1a;
            position: fixed;
            height: 100vh;
            overflow-y: auto;
        }
        
        .admin-sidebar-header {
            padding: 24px;
            border-bottom: 1px solid #1a1a1a;
        }
        
        .admin-nav-link {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 20px;
            margin: 4px 12px;
            color: #a0a0a0;
            text-decoration: none;
            border-radius: 10px;
            transition: all 0.3s ease;
        }
        
        .admin-nav-link:hover {
            background: #1a1a1a;
            color: #ffffff;
        }
        
        .admin-nav-link.active {
            background: #1a3a5c;
            color: #ffffff;
        }
        
        .admin-nav-link i {
            width: 20px;
            font-size: 1.1rem;
        }
        
        .admin-main-content {
            margin-left: 280px;
            padding: 24px;
            min-height: 100vh;
        }
        
        /* Cards */
        .stat-card {
            background: #111111;
            border: 1px solid #222222;
            border-radius: 12px;
            padding: 20px;
            transition: all 0.3s ease;
        }
        
        .stat-card:hover {
            border-color: #2c5282;
            transform: translateY(-2px);
        }
        
        /* Tables */
        .admin-table {
            width: 100%;
            background: #111111;
            border: 1px solid #222222;
            border-radius: 12px;
            overflow: hidden;
        }
        
        .admin-table th {
            background: #0a0a0a;
            padding: 12px 16px;
            text-align: left;
            color: #a0a0a0;
            font-weight: 600;
            font-size: 0.85rem;
            border-bottom: 1px solid #222222;
        }
        
        .admin-table td {
            padding: 12px 16px;
            border-bottom: 1px solid #222222;
            color: #e0e0e0;
        }
        
        .admin-table tr:hover {
            background: #1a1a1a;
        }
        
        /* Buttons */
        .btn-primary {
            background: #ffffff;
            color: #000000;
            padding: 8px 16px;
            border-radius: 8px;
            font-weight: 600;
            transition: all 0.3s ease;
            cursor: pointer;
        }
        
        .btn-primary:hover {
            background: #2c5282;
            color: #ffffff;
        }
        
        .btn-danger {
            background: #dc2626;
            color: #ffffff;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .btn-danger:hover {
            background: #b91c1c;
        }
        
        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        
        .modal-content {
            background: #111111;
            border: 1px solid #333333;
            border-radius: 12px;
            padding: 24px;
            max-width: 500px;
            width: 90%;
        }
        
        /* Badges */
        .badge-active {
            background: #22c55e;
            color: #000000;
            padding: 4px 8px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 600;
        }
        
        .badge-inactive {
            background: #6b7280;
            color: #ffffff;
            padding: 4px 8px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 600;
        }
        
        .badge-pending {
            background: #eab308;
            color: #000000;
            padding: 4px 8px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <!-- Admin Sidebar -->
    <aside class="admin-sidebar">
        <div class="admin-sidebar-header">
            <h2 class="text-2xl font-bold text-white">LAPTOP<span class="text-blue-500">IQ</span></h2>
            <p class="text-gray-500 text-xs mt-2">Admin Control Panel</p>
        </div>
        
        <nav class="mt-4">
            <a href="#" onclick="showAdminTab('dashboard')" class="admin-nav-link active" id="dashboard-link">
                <i class="fas fa-tachometer-alt"></i> Dashboard
            </a>
            <a href="#" onclick="showAdminTab('users')" class="admin-nav-link" id="users-link">
                <i class="fas fa-users"></i> Users
            </a>
            <a href="#" onclick="showAdminTab('laptops')" class="admin-nav-link" id="laptops-link">
                <i class="fas fa-laptop"></i> Laptops
            </a>
            <a href="#" onclick="showAdminTab('messages')" class="admin-nav-link" id="messages-link">
                <i class="fas fa-envelope"></i> Support Messages
            </a>
        </nav>
        
        <div class="absolute bottom-0 w-full p-4 border-t border-gray-800">
            <a href="/logout" class="admin-nav-link">
                <i class="fas fa-sign-out-alt"></i> Logout
            </a>
        </div>
    </aside>
    
    <!-- Main Content -->
    <main class="admin-main-content">
        {% block admin_content %}{% endblock %}
    </main>
    
    <script>
        function showAdminTab(tabName) {
            // Hide all tab contents
            document.querySelectorAll('.admin-tab-content').forEach(tab => {
                tab.classList.add('hidden');
            });
            
            // Show selected tab
            const activeTab = document.getElementById('tab-' + tabName);
            if (activeTab) activeTab.classList.remove('hidden');
            
            // Update active nav link
            document.querySelectorAll('.admin-nav-link').forEach(link => {
                link.classList.remove('active');
            });
            const activeLink = document.getElementById(tabName + '-link');
            if (activeLink) activeLink.classList.add('active');
        }
    </script>
</body>
</html>
