{% extends 'base.html' %}

{% block content %}
<div style="height: 80vh; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center;">
    <h1 style="font-size: 8rem; color: #3b82f6; margin: 0;">404</h1>
    <h2 style="margin-bottom: 20px;">Oops! Page Not Found</h2>
    <p style="color: #888; max-width: 400px; margin-bottom: 30px;">
        The page you are looking for might have been removed, had its name changed, or is temporarily unavailable.
    </p>
    <a href="{{ url_for('index') }}" style="padding: 12px 25px; background: #3b82f6; color: white; border-radius: 8px; text-decoration: none; font-weight: bold;">
        <i class="fas fa-home"></i> Back to Home
    </a>
</div>
{% endblock %}
