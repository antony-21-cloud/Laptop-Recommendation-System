{% extends 'base.html' %}

{% block content %}
<div class="min-h-screen bg-slate-950 text-slate-100 p-6 font-mono">
    <div class="flex justify-between items-center border-b border-slate-800 pb-4 mb-8">
        <div>
            <h1 class="text-2xl font-bold text-cyan-400 tracking-tighter">TERMINAL://SELLER_ROOT</h1>
            <p class="text-xs text-slate-500">Active Session: <span id="user-display" class="text-slate-300">Scanning...</span></p>
        </div>
        <button onclick="openModal()" class="bg-cyan-600 hover:bg-cyan-500 text-white px-4 py-2 rounded text-xs uppercase font-bold transition-all">
            + New Hardware Entry
        </button>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-8">
        <div class="bg-slate-900 border border-slate-800 p-4 rounded shadow-lg">
            <p class="text-slate-500 text-xs">TOTAL_UNITS</p>
            <h2 id="unit-count" class="text-2xl font-bold text-white">0</h2>
        </div>
    </div>

    <div class="bg-slate-900 border border-slate-800 rounded overflow-hidden shadow-2xl">
        <table class="w-full text-left text-sm">
            <thead class="bg-slate-800 text-slate-400 uppercase text-xs">
                <tr>
                    <th class="p-4">Model_ID</th>
                    <th class="p-4">Processor_Spec</th>
                    <th class="p-4">Valuation (Ksh)</th>
                    <th class="p-4 text-right">Operations</th>
                </tr>
            </thead>
            <tbody id="laptop-list-body" class="divide-y divide-slate-800">
                </tbody>
        </table>
    </div>
</div>

<div id="add-modal" class="fixed inset-0 bg-black/80 flex items-center justify-center hidden z-50">
    <div class="bg-slate-900 border border-cyan-500 p-6 rounded-lg w-full max-w-md shadow-[0_0_20px_rgba(6,182,212,0.5)]">
        <h2 class="text-cyan-400 font-bold mb-4 border-b border-slate-800 pb-2 uppercase tracking-widest">Input_New_Hardware_Data</h2>
        
        <div class="space-y-4">
            <input type="text" id="new-name" placeholder="MODEL_NAME (e.g. HP Victus)" class="w-full bg-slate-950 border border-slate-800 p-2 text-cyan-200 outline-none focus:border-cyan-500">
            <input type="text" id="new-processor" placeholder="PROCESSOR (e.g. Ryzen 7)" class="w-full bg-slate-950 border border-slate-800 p-2 text-cyan-200 outline-none focus:border-cyan-500">
            <input type="number" id="new-price" placeholder="VALUATION (Ksh)" class="w-full bg-slate-950 border border-slate-800 p-2 text-cyan-200 outline-none focus:border-cyan-500">
            
            <div class="flex gap-2 pt-4">
                <button onclick="submitNewLaptop()" class="flex-1 bg-cyan-600 hover:bg-cyan-500 text-white font-bold py-2 rounded uppercase text-xs">Commit_To_Database</button>
                <button onclick="closeModal()" class="flex-1 bg-slate-800 hover:bg-slate-700 text-slate-400 font-bold py-2 rounded uppercase text-xs">Abort</button>
            </div>
        </div>
    </div>
</div>
{% endblock %}
